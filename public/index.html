<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tess · Personal AI</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#05070b;color:#f5f7fa}body{display:flex;justify-content:center}.app{width:min(760px,100%);min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);display:flex;flex-direction:column}.top{display:flex;align-items:center;gap:13px;padding:18px 5px 14px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#8ee7ff 24%,#1786ff 58%,#061633);box-shadow:0 0 34px #1ea7ff99}.title{font-size:26px;font-weight:700}.status{font-size:13px;color:#8f9aaa;margin-top:2px}.panel{flex:1;min-height:0;border:1px solid #252b35;background:#0d1219;border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 60px #0008}.chat{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.msg{max-width:86%;padding:13px 15px;border-radius:20px;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.tess{background:#18222e;align-self:flex-start;border-bottom-left-radius:7px}.you{background:#147cff;align-self:flex-end;border-bottom-right-radius:7px}.bar{display:flex;gap:9px;padding:12px;background:#090d13;border-top:1px solid #252b35}.bar input{min-width:0;flex:1;border:1px solid #303844;border-radius:18px;background:#111720;color:#fff;padding:14px;font-size:16px;outline:none}.bar input:focus{border-color:#147cff}.bar button{border:0;border-radius:18px;background:#147cff;color:#fff;font-weight:700;font-size:16px;padding:0 17px}.mic{width:54px;padding:0!important}.mic.active{background:#e34b45}.hint{text-align:center;color:#6f7a89;font-size:12px;padding:10px 0 2px}.quick{display:flex;gap:8px;overflow:auto;padding:10px 12px 0}.quick button{white-space:nowrap;background:#151e29;border:1px solid #2b3542;color:#fff;border-radius:14px;padding:9px 13px;font-size:13px}.typing{display:none;align-items:center;gap:5px;color:#8f9aaa;font-size:13px;padding:0 18px 6px}.typing.show{display:flex}.dot{width:5px;height:5px;border-radius:50%;background:#7f8da0;animation:pulse 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes pulse{50%{opacity:.25}}
</style></head>
<body><main class="app"><header class="top"><div class="orb"></div><div><div class="title">Tess</div><div class="status" id="status">Online · ready</div></div></header><section class="panel"><div class="chat" id="chat"><div class="msg tess">Good evening, Brady. I'm Tess.<br><br>Your personal AI assistant is online. I can chat, remember what you choose to save, use current web information, and speak replies aloud.</div></div><div class="typing" id="typing"><span>Thinking</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="quick"><button data-q="What do you remember about me?">Memory</button><button data-q="Help me with my truck">Truck</button><button data-q="What is the latest news today?">Web</button></div><div class="bar"><button class="mic" id="mic">🎙️</button><input id="input" placeholder="Talk to Tess…"><button id="send">Send</button></div></section><div class="hint">Personal AI · memory · web · voice · phone-first</div></main><script src="chat.js"></script></body></html>
