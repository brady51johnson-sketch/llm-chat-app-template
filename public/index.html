<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tess</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#02060b;color:#eef7ff}button,input{font:inherit}body{display:flex;justify-content:center}.app{width:min(1050px,100%);min-height:100vh;display:flex;flex-direction:column}.top{height:76px;display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #10283a;background:#030911}.menu{display:none;width:42px;height:42px;border:1px solid #174866;background:#07131e;color:#dff6ff;border-radius:12px;font-size:21px}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#fff,#b8f3ff 20%,#32b8ff 42%,#0754c5 68%,#020c25);box-shadow:0 0 22px #20aaff99,0 0 60px #147cff44;animation:orb 3s ease-in-out infinite}.brand{font-size:24px;font-weight:700}.status{font-size:12px;color:#70acd0;margin-top:2px}.workspace{flex:1;display:flex;min-height:0}.sidebar{width:245px;border-right:1px solid #10283a;background:#030a11;padding:12px}.newchat{width:100%;padding:12px;border:1px solid #185273;border-radius:12px;background:#081824;color:#e7f8ff;font-weight:600}.chats{margin-top:12px;display:flex;flex-direction:column;gap:4px}.chatitem{padding:11px;border-radius:10px;color:#9fb3c2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.chatitem.active{background:#0d2333;color:#fff}.main{flex:1;min-width:0;display:flex;flex-direction:column}.chat{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:13px;background:radial-gradient(circle at 50% 0,#09203655,transparent 45%),#050c14}.msg{max-width:82%;padding:13px 15px;border-radius:19px;line-height:1.45;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}.tess{align-self:flex-start;background:#0b2130;border:1px solid #123d55;border-bottom-left-radius:6px}.you{align-self:flex-end;background:#0878d1;border:1px solid #1598ff;border-bottom-right-radius:6px}.typing{display:none;align-items:center;gap:5px;padding:0 24px 8px;color:#6fa9cb;font-size:13px}.typing.show{display:flex}.dot{width:5px;height:5px;border-radius:50%;background:#52c1ff;animation:p 1s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}.composer{padding:12px 16px 16px;background:#030a11;border-top:1px solid #10283a}.bar{display:flex;gap:8px;align-items:center}.input{flex:1;min-width:0;height:50px;border:1px solid #174866;border-radius:18px;background:#07131e;color:#fff;padding:0 16px;outline:none}.input:focus{border-color:#1da7ff}.send{height:50px;padding:0 18px;border:0;border-radius:18px;background:#087bd6;color:#fff;font-weight:700}.mic{width:52px;height:50px;border:1px solid #1b5575;border-radius:18px;background:#071823;color:#dff6ff;font-size:21px}.mic.active{background:#b43e42;border-color:#e35d62}.hint{text-align:center;color:#52758b;font-size:11px;margin-top:8px}.quick{display:flex;gap:7px;overflow:auto;margin-top:9px}.quick button{white-space:nowrap;border:1px solid #163c52;background:#07151f;color:#9fd8f5;border-radius:14px;padding:8px 12px;font-size:12px}@keyframes p{50%{opacity:.2}}@keyframes orb{50%{transform:scale(1.035);box-shadow:0 0 28px #20aaffbb,0 0 70px #147cff55}}@media(max-width:700px){.menu{display:block}.sidebar{position:fixed;z-index:10;top:0;bottom:0;left:0;width:82%;max-width:300px;transform:translateX(-105%);transition:.2s;box-shadow:18px 0 40px #000b}.sidebar.open{transform:translateX(0)}.chat{padding:18px 14px}.msg{max-width:90%}.top{height:68px}.orb{width:42px;height:42px}.brand{font-size:22px}}
</style></head>
<body><main class="app">
<header class="top"><button class="menu" id="menu">☰</button><div class="orb"></div><div><div class="brand">Tess</div><div class="status" id="status">Systems online · ready</div></div></header>
<div class="workspace"><aside class="sidebar" id="sidebar"><button class="newchat" id="newchat">＋ New conversation</button><div class="chats" id="chats"></div></aside>
<section class="main"><div class="chat" id="chat"></div><div class="typing" id="typing"><span>Thinking</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
<div class="composer"><div class="bar"><button class="mic" id="mic">🎙️</button><input class="input" id="input" placeholder="Talk to Tess…"><button class="send" id="send">Send</button></div><div class="quick"><button data-q="What do you remember about me?">Memory</button><button data-q="Help me with my truck">Truck</button><button data-q="What is happening today?">Today</button><button data-q="Search the web for the latest information">Web</button></div><div class="hint">VOICE-FIRST PERSONAL AI · TESS</div></div>
</section></div></main><script src="chat.js"></script></body></html>
